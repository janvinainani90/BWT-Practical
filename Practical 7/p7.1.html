<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JavaScript Example</title>

    <!-- Internal JavaScript -->
    <script>
        function showMessageInternal() {
            document.getElementById("internal").innerHTML =
                "This is the first example of JavaScript.";
        }
    </script>

    <!-- External JavaScript file -->
    <script src="7.1.js"></script>
</head>
<body>

    <h2>JavaScript Example</h2>

    <p id="internal"></p>
    <p id="external"></p>

    <button onclick="showMessageInternal()">Internal JS</button>
    <button onclick="showMessageExternal()">External JS</button>

</body>
</html>
