<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">    
<title>Practical 4.5</title>
</head>
<body>
<h3 align="center"><a href="#">Student Registration Form</a></h3>
<form align="left">
<fieldset style="width:600px; margin:auto; background-color:#e6e6e6;">
<table cellpadding="5" align="left">
<tr>
<td>First Name:</td>
<td><input type="text" placeholder="Enter your first name"></td>
</tr>
       <tr>
                   <td>Last Name:</td>
                   <td><input type="text" placeholder="Enter your last name"></td>
               </tr>
 
               <tr>
                   <td>Email:</td>
                   <td><input type="email" placeholder="it should contain @, ."></td>
               </tr>
 
               <tr>
                   <td>Mobile:</td>
                   <td><input type="text" placeholder="only 10 digits are
allowed"></td>
               </tr>
 
               <tr>
                   <td>Gender:</td>
                   <td>
                       <input type="radio" name="gender"> Male
                       <input type="radio" name="gender"> Female
                   </td>
               </tr>
 
               <tr>
                   <td>Date Of Birth:</td>
                   <td><input type="date"></td>
               </tr>
 
               <tr>
                   <td>Address:</td>
                   <td><textarea rows="4" cols="40"></textarea></td>
               </tr>
 
               <tr>
                   <td>City:</td>
                   <td><input type="text"></td>
               </tr>
 
               <tr>
                   <td>Area PIN:</td>
                    <td><input type="text"></td>
               </tr>
 
               <tr>
                   <td>State:</td>
                   <td><input type="text"></td>
               </tr>
 
               <tr>
                   <td>Qualification:</td>
                   <td>
                       <select>
                           <option>Select Qualification</option>
                           <option>10th</option>
                           <option>12th</option>
                           <option>Diploma</option>
                           <option>Graduate</option>
                           <option>Post Graduate</option>
                       </select>
                   </td>
               </tr>
 
               <tr>
                   <td>Specialization:</td>
                   <td>
                       <input type="checkbox"> Computer Science<br>
                       <input type="checkbox"> Information Technology<br>
                       <input type="checkbox"> Computer Architecture<br>
                       <input type="checkbox"> Tele Communication
                   </td>
               </tr>
 
               <tr>
                   <td>Password:</td>
                   <td><input type="password"></td>
               </tr>
 
               <tr>
                  <h6> <td><input align="left" type="submit" style="background-color: green;" value="Registered"></td> </h6>
               </tr>
           </table></body></html>
